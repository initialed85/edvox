<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b0d">
  <title>Voice</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="voice-shell">
    <button id="status-orb" class="status-orb off" type="button" aria-label="Start listening">
      <span class="orb-core" aria-hidden="true"></span>
    </button>
    <p id="status" class="status" role="status" aria-live="polite">Starting…</p>
    <p class="hint">Tap the light if the microphone needs permission.</p>
  </main>
  <div id="error" class="error" role="alert" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
